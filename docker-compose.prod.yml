services:

  db:
    image: postgres:18-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  r-service:
    image: franklinokech/redcap-sync-r-service:${APP_VERSION}
    restart: always
    env_file:
      - .env
    environment:
      PORT: 8000
      HOST: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - app-network

  backend:
    image: franklinokech/redcap-sync-backend:${APP_VERSION}
    restart: always
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      r-service:
        condition: service_healthy
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS}
      --timeout 120
    volumes:
      - staticfiles_volume:/app/staticfiles
    networks:
      - app-network

  celery:
    image: franklinokech/redcap-sync-backend:${APP_VERSION}
    restart: always
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      r-service:
        condition: service_healthy
    command: uv run celery -A config worker -l info -P solo
    networks:
      - app-network

  celery-beat:
    image: franklinokech/redcap-sync-backend:${APP_VERSION}
    restart: always
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run celery -A config beat -l info
    networks:
      - app-network

  frontend:
    image: franklinokech/redcap-sync-frontend:${APP_VERSION}
    restart: always
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:
  staticfiles_volume:

networks:
  app-network: