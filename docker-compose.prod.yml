# docker-compose.prod.yml
# Deploy this on every hospital server — same file, different .env

services:

  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  r-service:
    image: franklinokech/redcap-sync-r-service:${APP_VERSION:-latest}
    restart: always
    environment:
      PORT: 8000
      HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  backend:
    image: franklinokech/redcap-sync-backend:${APP_VERSION:-latest}
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      r-service:
        condition: service_healthy
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8001
      --workers 4
      --timeout 120
    volumes:
      - staticfiles_volume:/app/staticfiles

  celery:
    image: franklinokech/redcap-sync-backend:${APP_VERSION:-latest}
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      r-service:
        condition: service_healthy
    command: celery -A config worker -l info -P solo

  celery-beat:
    image: franklinokech/redcap-sync-backend:${APP_VERSION:-latest}
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info

  frontend:
    image: franklinokech/redcap-sync-frontend:${APP_VERSION:-latest}
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    volumes:
      - staticfiles_volume:/app/staticfiles

volumes:
  postgres_data:
  staticfiles_volume: