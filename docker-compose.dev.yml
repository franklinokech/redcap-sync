services:

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "redcap.local:host-gateway"


  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "redcap.local:host-gateway"


  r-service:
    build:
      context: ./r-sync-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${R_SERVICE_PORT}:8000"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "redcap.local:host-gateway"


  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DJANGO_PORT}:8000"

    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

    environment:
      UV_PROJECT_ENVIRONMENT: /app/.venv
      PYTHONPATH: /app
      PATH: /app/.venv/bin:$PATH

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      r-service:
        condition: service_healthy

    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000

    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "redcap.local:host-gateway"


  celery:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env

    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

    environment:
      UV_PROJECT_ENVIRONMENT: /app/.venv
      PYTHONPATH: /app
      PATH: /app/.venv/bin:$PATH

    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started

    command: celery -A config worker -l info -P solo

    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "redcap.local:host-gateway"


  celery-beat:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env

    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

    environment:
      UV_PROJECT_ENVIRONMENT: /app/.venv
      PYTHONPATH: /app
      PATH: /app/.venv/bin:$PATH

    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started

    command: celery -A config beat -l info

    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "redcap.local:host-gateway"


  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "redcap.local:host-gateway"


volumes:
  postgres_data:
  backend_venv:

networks:
  app-network:
