server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Health check
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

        # Django Admin
    location /admin/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve Django static files
    location /static/ {
        alias /app/staticfiles/;  # Path inside container where collectstatic puts files
    }

    # Vue Router history mode — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to Django backend
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Fallback if index.html missing
    error_page 404 /fallback.html;
}